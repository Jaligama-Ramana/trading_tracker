<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Tracker - Register</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #bbf7d0, #d1fae5);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.card {
    background: white;
    padding: 35px 30px;
    border-radius: 16px;
    width: 340px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

/* Title */
h2 {
    margin-bottom: 20px;
    color: #16a34a;
}

/* Inputs */
input {
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    font-size: 14px;
    outline: none;
    transition: 0.2s;
}

input:focus {
    border-color: #22c55e;
    box-shadow: 0 0 0 2px #bbf7d0;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #22c55e;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #16a34a;
}

/* Link */
p {
    margin-top: 15px;
    font-size: 14px;
}

a {
    color: #16a34a;
    text-decoration: none;
    font-weight: 600;
}

a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="card">
    <h2>Create Account</h2>

    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="register()">Register</button>

    <p>Already have an account? <a href="index.html">Login</a></p>
</div>

<script src="auth.js"></script>
<script>
function register() {
    if (!user.value || !pass.value) {
        alert("Please fill all fields");
        return;
    }
    registerUser(user.value, pass.value);
}
</script>

</body>
</html>
